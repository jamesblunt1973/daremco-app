<div dir="rtl">
    <ion-select label="انتخاب رجشمار" interface="popover" [(ngModel)]="result.raj">
        @for (raj of rajs; track raj) {
        <ion-select-option [value]="raj"> {{ raj }} </ion-select-option>
        }
    </ion-select>
    <ion-checkbox [(ngModel)]="result.turned">بافت به صورت چرخیده</ion-checkbox>
    <div>
        <ion-button (click)="dismiss(true)">تایید</ion-button>
        <ion-button (click)="dismiss(false)">لغو</ion-button>
    </div>
</div>
