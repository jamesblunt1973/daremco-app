<form #loginForm="ngForm" (ngSubmit)="login()">
    <ion-input
        [(ngModel)]="model.userName"
        name="username"
        placeholder="شماره همراه"
        type="text"></ion-input>
    <ion-input
        [(ngModel)]="model.password"
        name="password"
        placeholder="کد محصول"
        type="password"></ion-input>
    <div class="commands ion-display-flex ion-justify-content-around">
        <ion-button [disabled]="!loginForm.valid || loading"> ورود به برنامه </ion-button>
        @if(loading) {
        <ion-spinner name="circular" class="ion-margin-x-auto"></ion-spinner>
        }
        <ion-button fill="clear" routerLink="/auth/register">ثبت نام</ion-button>
    </div>
</form>
