<form #loginForm="ngForm" (ngSubmit)="login()">
    <ion-input
        [(ngModel)]="model.userName"
        name="username"
        placeholder="شماره همراه"
        type="text"></ion-input>
    <ion-input
        [(ngModel)]="model.password"
        name="password"
        placeholder="کد محصول"
        type="password"></ion-input>
    <div fxLayout="row" fxLayoutAlign="space-between" class="commands">
        <button mat-raised-button color="primary" [disabled]="!loginForm.valid || loading">
            ورود به برنامه
        </button>
        @if(loading) {
        <ion-spinner name="circular" class="ion-margin-x-auto"></ion-spinner>
        }
        <button type="button" mat-button routerLink="/auth/register">ثبت نام</button>
    </div>
</form>
